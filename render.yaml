# Render Deployment Blueprint for AirScribe Virtual Whiteboard
# https://render.com/docs/blueprint-spec

services:
  # Option 1: 100% Free Client-Side Static Site (Recommended: No cold starts, global CDN)
  - type: web
    name: airscribe-whiteboard
    runtime: static
    buildCommand: ""
    staticPublishPath: ./web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
